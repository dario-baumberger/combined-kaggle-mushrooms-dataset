name: Build and Publish Dataset

on:
  workflow_dispatch:
    inputs:
      version_notes:
        description: Version notes
        required: true
        default: ""
      dry_run:
        description: Dry run (skip Kaggle upload and GitHub release)
        type: boolean
        required: false
        default: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check python/
      - run: uv run ruff format --check python/

  publish:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - run: uv sync

      - name: Download datasets
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TQDM_MININTERVAL: '10'
        run: uv run python -m python.download

      - name: Merge and deduplicate
        env:
          TQDM_MININTERVAL: '10'
        run: uv run python -m python.merge

      - name: Validate
        env:
          TQDM_MININTERVAL: '10'
        run: uv run python -m python.validate

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: data/combined-kaggle-mushrooms-dataset/CHANGELOG.md

      - name: Publish to Kaggle
        id: publish
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          TQDM_MININTERVAL: '10'
        run: uv run python -m python.publish "${{ github.event.inputs.version_notes }}"${{ github.event.inputs.dry_run == 'true' && ' --dry-run' || '' }}

      - name: Create GitHub Release
        if: steps.publish.outputs.kaggle_version != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.publish.outputs.kaggle_version }}" \
            --title "Dataset v${{ steps.publish.outputs.kaggle_version }}" \
            --notes-file data/combined-kaggle-mushrooms-dataset/CHANGELOG.md
